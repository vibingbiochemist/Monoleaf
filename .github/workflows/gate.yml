# The quality gate, called by build.yml (every push to main and every PR) and by
# release.yml (every tag). One definition, two callers.
#
# It exists as a reusable workflow because release.yml had grown a near-copy of
# build.yml's two gate jobs — fifteen steps including a third copy of the apt
# list — and two copies of a gate drift apart exactly like two copies of a
# suppression list do. The audit stayed a composite action (see
# .github/actions/audit) because it slots into a job that already has checkout,
# Node and cargo; a whole gate is jobs, not steps, so it has to be a workflow.
#
# TWO jobs, not one, deliberately: `fast` is well under a minute and `rust` is
# minutes, they share nothing, and callers wait on both. Collapsing them would
# serialise the slow half behind the quick half for no benefit.
#
# No secrets and no write access: nothing here talks to anything that needs
# either, so callers must NOT pass `secrets: inherit`. A called workflow can
# never hold more permission than its caller, and contents: read is the whole
# requirement.
#
# Actions are pinned to full commit SHAs for the same reason as in the callers: a
# tag is mutable. Local `./.github/...` references need no pin, being versioned
# with the commit that uses them.
name: gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # JS-side license gate. The Rust tree already has one (src-tauri/about.toml,
      # enforced below) but nothing stopped a GPL/AGPL package from entering the
      # JS tree — license-checker-rseidelsohn was only ever used to generate
      # THIRD_PARTY_LICENSES.md text, never to fail on anything. --onlyAllow is a
      # positive list, matching about.toml's own approach, built from what is
      # actually in the tree today (`npx license-checker-rseidelsohn --production
      # --excludePrivatePackages --summary`): MIT, Apache-2.0, BSD-2/3-Clause,
      # ISC, CC0-1.0, MPL-2.0 (dompurify's OR-alternative to Apache-2.0),
      # Python-2.0 (argparse) and OFL-1.1 (the six bundled document/code
      # fonts — @fontsource-variable/* and @fontsource/ibm-plex-mono). A new
      # dependency outside this list fails the build rather than silently
      # entering it; adding to the list is a deliberate, reviewable change,
      # same as adding to about.toml's `accepted`.
      - run:
          npx license-checker-rseidelsohn --production --excludePrivatePackages
          --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;CC0-1.0;MPL-2.0;Python-2.0;OFL-1.1"

  # The Rust unit tests (byte-exact file round-trip, write-path allow-list,
  # launch-arg parsing) need the toolchain and a built frontend, since compiling
  # the crate runs Tauri's generate_context! against ../dist.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # `toolchain: stable` is stated explicitly because the SHA pin means the
      # ref no longer says which toolchain this is. The action defaults to
      # stable, so this is documentation rather than a fix.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch @ 2026-07-16
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: ./.github/actions/linux-deps
      - run: npm ci
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: npm run build # dist/ is needed for Tauri's generate_context!
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      # Rust-side license gate. src-tauri/about.toml's `accepted` list already
      # makes cargo-about fail on anything outside it (e.g. GPL) — but until now
      # the only thing that ever ran cargo-about was `npm run licenses`, a manual
      # step during release prep, so a disallowed license landing between
      # releases would not be caught until someone remembered to regenerate
      # THIRD_PARTY_LICENSES.md. This runs the same generator on every push/PR,
      # against a throwaway output path: the check is the exit code, not the
      # file. Version-pinned with --locked for the same reason cargo-audit is
      # below. `--features cli` is required, not optional: the crate ships its
      # binary behind that feature, so a plain `cargo install cargo-about`
      # compiles successfully and installs nothing, and `cargo about generate`
      # then fails with "no such command: about" — this broke every PR's gate
      # the moment it landed, caught within minutes via the first Dependabot PRs.
      - run: cargo install cargo-about --version 0.9.1 --locked --features cli
      - run: cargo about generate --manifest-path src-tauri/Cargo.toml
          -o "$RUNNER_TEMP/third-party-licenses.md" src-tauri/about.hbs
      # npm + cargo advisory checks. The suppression list and the reasoning for
      # it live in the action, once, so no caller can drift from another.
      - uses: ./.github/actions/audit
