# Publish a release. Push a version tag to trigger it:
#
#     git tag v1.0.0 && git push origin v1.0.0
#
# It runs the tests, builds the Windows installer and the Linux AppImage, and
# creates a DRAFT GitHub Release with both attached — you review and click
# "Publish" so nothing goes public by accident. (Can also be run manually from
# the Actions tab via workflow_dispatch, from a tagged commit.)
#
# Windows is the tested, primary target. Linux ships too, labeled best-effort in
# the release body below — it is community-tested (works on at least one real
# machine outside CI), not exercised as broadly as Windows. macOS stays
# verification-only in build.yml: unlike the other two, an unsigned/unnotarized
# .dmg is a hard Gatekeeper block for most users rather than a click-through
# warning, so shipping it needs a paid Apple Developer account first.
name: release

on:
  # A plain dispatch (the box unticked) is the normal release path, run by hand
  # from a tagged commit. Ticking the box runs ONLY the rehearsal job at the
  # bottom, which builds and signs the updater artifacts and creates no release.
  workflow_dispatch:
    inputs:
      updater_dry_run:
        description: "Rehearse the updater artifacts: build and sign them, upload as workflow artifacts, publish nothing."
        type: boolean
        default: false
  push:
    tags: ["v*"]

# Read-only by default. Only the release job below widens this to contents:
# write, and only because publishing the Release needs it — so the version and
# gate jobs cannot write to the repository even though they run in the workflow
# that publishes. Without this block they would inherit whatever the repository
# default token grants.
permissions:
  contents: read

# Actions are pinned to full commit SHAs, not tags: a tag is mutable, and this
# workflow's release job holds contents: write, so a retagged action would run
# with permission to publish. Refresh with, e.g.:
#   gh api repos/actions/checkout/git/ref/tags/v4 --jq .object.sha
jobs:
  # Tag-specific, so it is not part of the shared gate. Its own job rather than
  # the first step of one: a reusable workflow can only be called as a job, and
  # splitting this out means a seconds-long check runs beside the gate instead of
  # holding thirteen minutes of work behind itself.
  version:
    # Every publishing job is switched off for the rehearsal, so a dry run cannot
    # reach the code that creates a release even by accident. `inputs` is empty on
    # a tag push, so this is true there.
    if: ${{ !inputs.updater_dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # Fail before anything expensive. The release name comes from the tag and
      # the installer name comes from tauri.conf.json, and nothing used to check
      # they agree — so a tag could publish "Monoleaf v1.2.3" containing
      # Monoleaf_0.9.0_x64-setup.exe.
      #
      # A pre-release suffix is allowed: everything from the first "-" is
      # dropped, so v0.9.0-rc1 is a valid tag for tree version 0.9.0. Requiring
      # the suffix in tauri.conf.json would mean editing the tree for every
      # release candidate. The consequence is deliberate: a throwaway CI tag
      # must carry the real version, so v0.9.0-ci-test passes and
      # v0.0.0-ci-test does not. There is no bypass — an escape hatch here is a
      # hole someone eventually ships through.
      # Three manifests declare the version, not two. Cargo's reaches the
      # binary's own metadata, so it can drift from the installer filename with
      # nothing noticing.
      #
      # Cargo.toml is TOML, so it is read with awk scoped to the [package]
      # section rather than a bare grep for a line starting "version": a future
      # dependency table can legitimately put `version = ` at the start of a
      # line, and matching that would compare the wrong value.
      - name: Tag must match the version in the tree
        run: |
          tag="$GITHUB_REF_NAME"
          core="${tag#v}"
          core="${core%%-*}"
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(awk '
            /^[[:space:]]*\[/ { inpkg = ($0 ~ /^[[:space:]]*\[package\]/) }
            inpkg && /^[[:space:]]*version[[:space:]]*=/ {
              sub(/^[^=]*=[[:space:]]*/, "")
              sub(/[[:space:]]*#.*$/, "")
              gsub(/"/, "")
              gsub(/[[:space:]]/, "")
              print
              exit
            }
          ' src-tauri/Cargo.toml)

          # A failed extraction must not look like a mismatch, or someone will
          # "fix" it by editing a manifest that was already correct.
          if [ -z "$cargo" ]; then
            echo "Could not extract a version from the [package] section of src-tauri/Cargo.toml."
            echo "This is an EXTRACTION failure, not a version mismatch: the manifests may all"
            echo "be correct. Fix the parsing in this workflow step, not the manifests."
            exit 1
          fi

          if [ "$core" != "$pkg" ] || [ "$core" != "$conf" ] || [ "$core" != "$cargo" ]; then
            echo "Tag does not match the version in the tree."
            echo "  tag                       : $tag  (version part: $core)"
            echo "  package.json              : $pkg"
            echo "  src-tauri/tauri.conf.json : $conf"
            echo "  src-tauri/Cargo.toml      : $cargo"
            exit 1
          fi
          echo "tag $tag matches version $core in all three manifests"

  # The same gate build.yml runs, not a subset of it. The audits especially: an
  # advisory matters most at the moment a binary is handed to someone, and a tag
  # can point at a commit that never went through build.yml, or arrive via
  # workflow_dispatch, so checking only on the path that publishes nothing was
  # the wrong way round.
  #
  # No `secrets: inherit` — the gate needs none, and a called workflow cannot
  # hold more permission than its caller regardless.
  gate:
    if: ${{ !inputs.updater_dry_run }}
    uses: ./.github/workflows/gate.yml

  release:
    if: ${{ !inputs.updater_dry_run }}
    needs: [version, gate]
    # Two platforms, one release: both legs target the same tagName, and
    # tauri-action's own find-or-create-by-tag logic (not a separate
    # create-release job) is what upstream's own multi-platform example relies
    # on, so this follows that rather than inventing a second pattern.
    # fail-fast: false, matching build.yml — a Linux bundle failure must not
    # cancel the Windows upload that was already in flight, and the draft
    # state is what makes an incomplete pair of assets safe to notice and fix
    # before publishing rather than something that ships silently.
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write # create the GitHub Release and upload the installer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch @ 2026-07-16
        with:
          toolchain: stable # the SHA pin hides which toolchain this is

      - uses: ./.github/actions/linux-deps
        if: startsWith(matrix.platform, 'ubuntu')

      - run: npm ci

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required by the bundler as soon as createUpdaterArtifacts is on, which
          # is exactly what the --config below turns on. The two are coupled: this
          # step fails without either of them, and produces an unsigned release
          # nobody can update to if the config is applied without the secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # The release path, and only the release path, produces updater
          # artifacts. `createUpdaterArtifacts` deliberately lives in this
          # override rather than tauri.conf.json, because in the base config it
          # would make every pull-request build demand the signing secret — which
          # a fork cannot have. See the header of the file itself.
          #
          # Absolute rather than repo-relative: the action runs `tauri build` with
          # its own working directory (`root`, from projectPath), and a --config
          # path is resolved against the process's cwd. Anchoring it to the
          # workspace means the override cannot silently fail to be found, which
          # would produce a release with no updater artifacts and no error.
          args: --config ${{ github.workspace }}/src-tauri/tauri.release.conf.json5
          tagName: ${{ github.ref_name }}
          releaseName: "Monoleaf ${{ github.ref_name }}"
          releaseBody: >-
            See the assets below to download and install. The Windows installer
            is unsigned (SmartScreen may warn: More info → Run anyway). The
            Linux AppImage is community-tested, best-effort — please file an
            issue if you hit a problem with it.
          # Draft is unconditional: it is the safety property, so nothing gets
          # to make it depend on the tag.
          releaseDraft: true
          # A suffixed tag is a pre-release, and must not be labelled a full
          # one. This was hardcoded false while the version gate above
          # deliberately permits v0.9.0-rc1, so an rc published as final.
          #
          # COUPLED: "a '-' means pre-release" is the same rule the "Tag must
          # match the version in the tree" step applies when it strips
          # everything from the first "-". Change one and you must change the
          # other; they cannot be expressed once because that step is shell and
          # this is a workflow expression evaluated before any step runs.
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Rehearse the updater artifacts without publishing anything.
  #
  # WHY THIS EXISTS. build.yml never sets createUpdaterArtifacts, so until now no
  # CI run had ever produced a signature. That left the signing path — the one
  # step that needs a secret the maintainer cannot test locally without holding
  # the private key in the environment — first exercised during a real release,
  # which is the worst moment to discover a missing or malformed secret.
  #
  # HOW IT CANNOT PUBLISH. Three independent barriers, not one:
  #
  #   1. `permissions: contents: read`. The job's token is issued without write
  #      access, so a call to the releases API is refused by GitHub regardless of
  #      what the workflow asks for. This is the barrier that holds even if
  #      someone later edits the step wrongly.
  #   2. No `tagName` and no `releaseId`. tauri-action only creates or touches a
  #      release inside `if (tagName && !releaseId)`; with neither it logs "No
  #      releaseId or tagName provided, skipping all uploads..." and does nothing
  #      but build. That is the same build-only shape build.yml already relies on.
  #   3. No GITHUB_TOKEN in the step's environment at all, so there is no
  #      credential for an API call to be made with.
  #
  # It is also mutually exclusive with the publishing path: the three jobs above
  # are switched off by the same input that switches this one on, so one dispatch
  # can never do both.
  updater-dry-run:
    if: ${{ inputs.updater_dry_run }}
    runs-on: windows-latest
    permissions:
      contents: read # barrier 1: cannot create a release even if asked to
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch @ 2026-07-16
        with:
          toolchain: stable # the SHA pin hides which toolchain this is

      - run: npm ci

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          # Deliberately no GITHUB_TOKEN (barrier 3). The signing secrets ARE
          # needed: the whole point is to prove they work before a release
          # depends on them.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # The same override the release path uses, so what is rehearsed is the
          # real configuration rather than a copy of it.
          args: --config ${{ github.workspace }}/src-tauri/tauri.release.conf.json5
          # No tagName (barrier 2).

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: updater-dry-run
          # `if-no-files-found: error`, unlike build.yml's `warn`: the signature is
          # the artifact this job exists to produce, so its absence is the failure
          # this job exists to detect.
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
