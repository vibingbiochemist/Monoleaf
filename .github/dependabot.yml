# Monoleaf has no auto-updater: a security fix reaches users only when they
# download and reinstall. That makes finding out about a vulnerable dependency
# early the whole game, and this is the main way it happens — the audit steps in
# build.yml catch what is already public, Dependabot opens the PR that fixes it.
#
# All three ecosystems the app actually ships or builds with are covered. The
# Cargo manifest lives in src-tauri, not the repo root. github-actions covers the
# SHA pins in the workflows — Dependabot updates the pin and its version comment
# together, which is what makes pinning maintainable rather than a chore.
#
# Minor and patch bumps arrive grouped into one PR per ecosystem to keep the
# noise down; majors stay separate because they need individual review. Security
# updates are opened regardless of schedule once Dependabot alerts are enabled in
# the repository settings.
#
# Grouping contributed by Andrew Gockenbach.
#
# CURRENTLY DORMANT. `open-pull-requests-limit: 0` disables version-update pull
# requests, which is GitHub's documented way to switch an ecosystem off from the
# config rather than from a repository setting.
#
# It is off because Dependabot's first scan happens the moment this file lands on
# a default branch — not on the weekly schedule — and the default limit is five
# per ecosystem, so enabling all three at once opens up to fifteen pull requests
# immediately. Each one runs the full CI gate, and on a private repository those
# minutes are metered and billed at up to 10x for macOS.
#
# TO ACTIVATE, once the repository is public and Actions minutes are free:
# change all three zeros to 3. Nothing else needs to change. Security updates are
# not subject to this limit and arrive regardless once Dependabot alerts are on.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0 # dormant until public; see the note above
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 0 # dormant until public; see the note above
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0 # dormant until public; see the note above
    # The seven pinned actions would otherwise arrive as seven separate pull
    # requests, each running the whole gate.
    groups:
      actions-all:
        patterns: ["*"]
