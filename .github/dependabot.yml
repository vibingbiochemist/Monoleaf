# Monoleaf has no auto-updater: a security fix reaches users only when they
# download and reinstall. That makes finding out about a vulnerable dependency
# early the whole game, and this is the main way it happens — the audit steps in
# build.yml catch what is already public, Dependabot opens the PR that fixes it.
#
# All three ecosystems the app actually ships or builds with are covered. The
# Cargo manifest lives in src-tauri, not the repo root. github-actions covers the
# SHA pins in the workflows — Dependabot updates the pin and its version comment
# together, which is what makes pinning maintainable rather than a chore.
#
# Minor and patch bumps arrive grouped into one PR per ecosystem to keep the
# noise down; majors stay separate because they need individual review. Security
# updates are opened regardless of schedule once Dependabot alerts are enabled in
# the repository settings.
#
# Grouping contributed by Andrew Gockenbach.
#
# Every pull request Dependabot opens runs the full CI gate, so the open limits
# below are a cost control, not tidiness: the default is five per ecosystem,
# which on first enabling means fifteen simultaneous runs. Three at a time still
# keeps updates flowing without a queue nobody asked for.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # The seven pinned actions would otherwise arrive as seven separate pull
    # requests, each running the whole gate.
    groups:
      actions-all:
        patterns: ["*"]
