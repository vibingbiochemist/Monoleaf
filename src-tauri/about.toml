# cargo-about configuration: the set of licenses we accept in the Rust
# dependency tree. All permissive (or file-level weak-copyleft for MPL-2.0,
# which requires attribution but does not affect our licensing options).
# cargo-about fails the build of THIRD_PARTY_LICENSES.md if anything outside
# this list (e.g. GPL) ever enters the tree — which is exactly the guard the
# brief asks for.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    # webpki-root-certs, reached via rustls-platform-verifier -> reqwest. The
    # Community Data License Agreement is a *data* licence, which is what that
    # crate ships: Mozilla's CA root certificates rather than code. Permissive —
    # it requires attribution and imposes no condition on our own licensing.
    #
    # Deliberately accepted rather than scoped away. `cargo tree` shows this crate
    # is in neither the Windows nor the Linux graph, so a `targets` key here would
    # also silence it — but a scoping config that quietly stops covering a target
    # under-discloses, and over-disclosing one licence costs nothing.
    "CDLA-Permissive-2.0",
]
